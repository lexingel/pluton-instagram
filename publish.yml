name: Instagram yayın
on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir kontrol (GitHub birkaç dakika gecikebilir)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Saati gelen postları yayınla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          API_HOST: graph.facebook.com
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 scripts/publish.py
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "pluton-bot"; git config user.email "bot@users.noreply.github.com"
          git add posts && git commit -m "yayın durumu güncellendi" && git push || echo "değişiklik yok"

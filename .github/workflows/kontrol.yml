name: Bağlantı kontrolü
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfalar ve Instagram ID
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          echo "== Pages and linked Instagram accounts =="
          curl -sg "https://graph.facebook.com/v21.0/me/accounts?fields=name,instagram_business_account{id,username}&access_token=$IG_TOKEN"
          echo
          if [ -n "$IG_USER_ID" ]; then
            echo "== IG_USER_ID check and publishing quota =="
            curl -sg "https://graph.facebook.com/v21.0/$IG_USER_ID?fields=username&access_token=$IG_TOKEN"; echo
            curl -sg "https://graph.facebook.com/v21.0/$IG_USER_ID/content_publishing_limit?access_token=$IG_TOKEN"; echo
          fi
